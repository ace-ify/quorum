# BlindCouncil Industry Architecture Pattern Catalog
# Grounded, battle-tested engineering blueprints from Netflix, Stripe, AWS, and Google.
# Prevents LLM free-styling, amateur algorithmic reinvention, and hallucinated patterns.

patterns:
  security:
    - name: "Envelope Encryption (KMS Data Key Pattern)"
      origin: "AWS KMS / NIST SP 800-57"
      description: "Encrypt message payloads with ephemeral symmetric data keys (DEKs); encrypt the DEK with a customer-managed master key (CMK). Prevents centralized key storage leaks."
    - name: "Redis Ephemeral Bloom Filter Revocation"
      origin: "Netflix EVCache / Zero-Trust Session RFC"
      description: "Hash active JWT/token revocation IDs into an in-memory Bloom filter to allow O(1) <1ms revocation checks on every WebSocket heartbeat without hitting the central relational database."

  scalability:
    - name: "Exponential Backoff with Full Jitter"
      origin: "AWS Architecture Center Standard"
      description: "When gateway reconnects occur after a restart, enforce client-side randomized backoff: t = random(0, min(max_backoff, base * 2^attempt)). Prevents reconnect thundering herds from crashing ingress pods."
    - name: "Async Stream Buffering with Backpressure"
      origin: "Reactive Streams Specification / Kafka Architecture"
      description: "Decouple real-time ingress WebSocket writes from database persistence via append-only commit logs (Redis Streams / Kafka), capping memory queues and shedding load at 80% saturation."

  database:
    - name: "Transactional Outbox Pattern"
      origin: "Martin Kleppmann (Designing Data-Intensive Applications)"
      description: "Write business state changes and domain events to the database in a single ACID transaction; an asynchronous CDC worker (Debezium) pushes events to the stream. Eliminates dual-write data loss and phantom rows."
    - name: "Single-Table Partition Key Hierarchy"
      origin: "Amazon DynamoDB Best Practices (Alex DeBrie)"
      description: "Model multiple entity types in a single DynamoDB table using composite partition keys (ORG#<id>) and sort keys (ORDER#<id>). Avoids hot partition throttling by appending hashed buckets to high-velocity keys."

  finops:
    - name: "AWS PrivateLink VPC Endpoint Routing"
      origin: "AWS Well-Architected Framework (Cost Optimization)"
      description: "Route inter-service pod-to-pod traffic within the same AWS region over PrivateLink interface VPC endpoints instead of public NAT Gateways, eliminating $0.045/GB cross-AZ data egress fees."
    - name: "Auto-Sharding Provisioned Thresholds"
      origin: "Cloud Native FinOps Foundation Standard"
      description: "Start clusters with minimal baseline nodes (e.g. 4 nodes) and configure horizontal auto-sharding scaling triggers at 75% memory/CPU utilization. Avoids upfront 12-node over-provisioning waste ($25,200/year savings)."

  compliance:
    - name: "Per-User Crypto-Shredding"
      origin: "EU GDPR Article 17 Architecture Standard"
      description: "Encrypt all user-identifiable records with a unique user-specific KMS key. When a user requests 'Right to Erasure', destroy that specific key. Data in immutable append-only logs becomes cryptographically unrecoverable ciphertext without breaking log offsets."
